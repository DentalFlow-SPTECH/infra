# Dental Flow completo para a apresentação: MySQL com os dados da demo, API Spring Boot e frontend React.
# Suba com ./subir.sh (Linux/macOS) ou subir.cmd (Windows); eles usam: docker compose --env-file versoes.env up -d --build
name: dentalflow

services:
  db:
    build: ./docker/db
    image: dentalflow/db-apresentacao:2026-10-29
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: ./docker/backend
      additional_contexts:
        source: https://github.com/DentalFlow-SPTECH/backend.git#${BACKEND_REF:?defina BACKEND_REF em versoes.env}
    image: dentalflow/backend:${BACKEND_REF}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dentalFlow?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-1234}
      # Igual ao backend usado no desenvolvimento: sem validar o esquema, porque a view vw_dashboard_mensal
      # devolve `ano` como YEAR e a entidade espera inteiro (com "validate" a API não sobe).
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_BIND: WARN
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./docker/frontend
      additional_contexts:
        source: https://github.com/DentalFlow-SPTECH/frontend.git#${FRONTEND_REF:?defina FRONTEND_REF em versoes.env}
    image: dentalflow/frontend:${FRONTEND_REF}
    ports:
      - "${WEB_PORT:-5180}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
